[pytest]
DJANGO_SETTINGS_MODULE = tests.settings
django_find_project = false
pythonpath = src
testpaths = tests
python_files = test_*.py
addopts =
    -ra
    --strict-config
    --strict-markers
    --tb=short
    --showlocals
    --durations=10
    --color=yes
asyncio_mode = auto
filterwarnings =
    error
markers =
    unit
    integration
    security
    django_db
