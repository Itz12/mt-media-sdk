[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt-media-sdk"
version = "1.0.0"
description = "Secure reusable Django media upload, processing, storage, and progress SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Must Tip" }]
keywords = ["django", "media", "uploads", "storage", "security"]
dependencies = [
  "Django>=4.2,<6.1",
  "djangorestframework>=3.14,<4",
  "django-filter>=23.5,<26",
  "channels>=4,<5",
  "celery>=5.3,<6",
  "cryptography>=50,<51",
  "Pillow>=10,<14",
  "pypdf>=4,<7",
  "bleach>=6,<7",
  "lxml>=5,<7",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34,<2"]
redis = ["redis>=5,<8", "channels-redis>=4,<5"]
security = [
  "python-magic>=0.4.27,<1",
  "clamd>=1.0.2,<2",
  "py7zr>=0.22,<2",
  "rarfile>=4.2,<5",
]
all = [
  "boto3>=1.34,<2",
  "redis>=5,<8",
  "channels-redis>=4,<5",
  "python-magic>=0.4.27,<1",
  "clamd>=1.0.2,<2",
  "py7zr>=0.22,<2",
  "rarfile>=4.2,<5",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-django>=4.9,<5",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["mt_media_sdk*"]

[tool.setuptools.package-data]
mt_media_sdk = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "B", "S314", "S324", "S603"]
ignore = [
  # Validation layers intentionally replace internal exceptions with stable,
  # non-sensitive public errors after logging the original exception.
  "B904",
]
